<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Кино на сегодня</title><style>
:root{--bg:#0b0c10;--panel:#13151b;--panel2:#1a1d25;--text:#f5f3ee;--muted:#a7a7ad;--line:#2b2e37;--accent:#d8ff4d;--warm:#ffb45c}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 75% -10%,#252b20 0,#0b0c10 34%),#0b0c10;color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}button{cursor:pointer}
.app{min-height:100vh}.nav{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;border-bottom:1px solid rgba(255,255,255,.07);position:sticky;top:0;background:rgba(11,12,16,.84);backdrop-filter:blur(16px);z-index:10}.brand{font-weight:800;letter-spacing:-.04em;font-size:20px}.brand span{color:var(--accent)}.navlink{color:var(--muted);background:none;border:0}.navlink.active{color:var(--text)}
.wrap{max-width:1240px;margin:auto;padding:44px 5vw 72px}.eyebrow{color:var(--accent);text-transform:uppercase;letter-spacing:.15em;font-size:11px;font-weight:800}.hero{display:flex;justify-content:space-between;gap:32px;align-items:end;margin-bottom:28px}.hero h1{font-size:clamp(38px,6vw,76px);line-height:.95;letter-spacing:-.065em;margin:10px 0 14px;max-width:760px}.hero p{color:var(--muted);max-width:600px;font-size:16px;margin:0}.stats{display:flex;gap:20px;color:var(--muted);white-space:nowrap}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0 32px}.chip{border:1px solid var(--line);background:transparent;color:#d5d5da;padding:9px 13px;border-radius:999px}.chip.active{background:var(--text);color:#111;border-color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:18px}.card{min-width:0;cursor:pointer}.poster{aspect-ratio:2/3;border-radius:12px;overflow:hidden;background:#20232b;position:relative;border:1px solid rgba(255,255,255,.06)}.poster img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}.card:hover .poster img{transform:scale(1.035)}.badge{position:absolute;left:9px;top:9px;background:rgba(8,9,11,.78);backdrop-filter:blur(7px);border-radius:999px;padding:5px 8px;font-size:11px}.card h3{font-size:16px;line-height:1.15;margin:11px 0 5px;letter-spacing:-.02em}.meta{color:var(--muted);font-size:12px}.empty{padding:50px 0;color:var(--muted)}
.detail{display:grid;grid-template-columns:minmax(260px,360px) 1fr;gap:52px;align-items:start}.detail-poster{border-radius:16px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45)}.detail-poster img{width:100%;display:block}.back{border:0;background:none;color:var(--muted);padding:0;margin-bottom:28px}.back:hover{color:var(--text)}.detail h1{font-size:clamp(42px,6vw,76px);line-height:.9;letter-spacing:-.065em;margin:9px 0 8px}.original{font-size:18px;color:var(--muted);margin-bottom:22px}.tags{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tag{background:var(--panel2);padding:7px 10px;border-radius:999px;color:#ddd;font-size:12px}.logline{font-size:21px;line-height:1.35;max-width:720px;margin:26px 0}.body{color:#c3c3c8;max-width:760px}.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);margin:30px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden}.fact{background:var(--panel);padding:15px}.fact b{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}.recommend{margin-top:55px}.recommend h2{font-size:28px;letter-spacing:-.04em}.mini-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}.detail{grid-template-columns:250px 1fr}.mini-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.nav{height:62px}.wrap{padding-top:30px}.hero{display:block}.stats{margin-top:18px}.grid{grid-template-columns:repeat(2,1fr);gap:14px}.detail{display:block}.detail-poster{max-width:280px;margin-bottom:30px}.facts{grid-template-columns:1fr}.mini-grid{grid-template-columns:repeat(2,1fr)}.detail h1{font-size:50px}}
</style></head><body><nav class="nav"><div class="brand">film<span>tonight</span></div><button class="navlink active" onclick="location.hash=''">Подборка</button></nav><div id="app"></div><script src="movies-data.js"></script><script>
const app=document.getElementById('app');
const genres=[...new Set(MOVIES.flatMap(m=>m.details.genres))].sort((a,b)=>a.localeCompare(b,'ru'));
let state={genre:'Все', q:''};

function poster(m){return m._poster}
function card(m){
  const id=m.identification.kinopoisk_id;
  return `<article class="card" onclick="location.hash='film/${id}'">
    <div class="poster"><img src="${poster(m)}" alt="${esc(m.identification.title_ru)}"><span class="badge">${m.identification.year}</span></div>
    <h3>${esc(m.identification.title_ru)}</h3>
    <div class="meta">${m.details.genres.slice(0,2).join(' · ')} · ${m.details.runtime_minutes} мин</div>
  </article>`
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}

function home(){
 const list=MOVIES.filter(m=>(state.genre==='Все'||m.details.genres.includes(state.genre)) && (!state.q || (m.identification.title_ru+' '+m.identification.title_original).toLowerCase().includes(state.q.toLowerCase())));
 app.innerHTML=`<main class="wrap">
   <section class="hero"><div><div class="eyebrow">Кино на сегодня</div><h1>Не листай бесконечно.<br>Выбери фильм.</h1><p>Небольшая подборка, чтобы за пару минут найти кино под сегодняшнее настроение.</p></div><div class="stats"><span>${MOVIES.length} фильмов</span><span>на вечер</span></div></section>
   <div style="display:flex;gap:10px;max-width:560px;margin-bottom:14px"><input id="search" value="${esc(state.q)}" placeholder="Найти по названию…" style="flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--text);outline:none"></div>
   <div class="filters"><button class="chip ${state.genre==='Все'?'active':''}" onclick="setGenre('Все')">Все</button>${genres.map(g=>`<button class="chip ${state.genre===g?'active':''}" onclick="setGenre('${esc(g)}')">${esc(g)}</button>`).join('')}</div>
   <section class="grid">${list.length?list.map(card).join(''):`<div class="empty">Ничего не нашлось. Попробуйте другой жанр или название.</div>`}</section>
 </main>`;
 document.getElementById('search').addEventListener('input',e=>{state.q=e.target.value; home(); document.getElementById('search').focus(); document.getElementById('search').setSelectionRange(state.q.length,state.q.length)});
}
function setGenre(g){state.genre=g;home()}
function film(id){
 const m=MOVIES.find(x=>String(x.identification.kinopoisk_id)===String(id)); if(!m){home();return}
 const c=m.creators, d=m.details, cont=m.content;
 const related=MOVIES.filter(x=>x!==m && x.details.genres.some(g=>d.genres.includes(g))).sort((a,b)=>score(b,m)-score(a,m)).slice(0,4);
 app.innerHTML=`<main class="wrap"><button class="back" onclick="location.hash=''">← Назад к подборке</button>
 <section class="detail"><div class="detail-poster"><img src="${poster(m)}" alt="${esc(m.identification.title_ru)}"></div>
 <div><div class="eyebrow">${d.genres.join(' · ')}</div><h1>${esc(m.identification.title_ru)}</h1><div class="original">${esc(m.identification.title_original)} · ${m.identification.year}</div>
 <div class="tags"><span class="tag">${d.runtime_minutes} мин</span><span class="tag">${d.age_ratings?.[0]?.rating||'—'}</span><span class="tag">${esc(d.countries.join(', '))}</span><span class="tag">${esc(d.color)}</span></div>
 <div class="logline">${esc(cont.logline)}</div><p class="body">${esc(cont.synopsis)}</p>
 <div class="facts"><div class="fact"><b>Режиссёр</b>${esc(c.directors?.join(', '))}</div><div class="fact"><b>В ролях</b>${esc(m.cast.slice(0,4).map(x=>x.name_ru).join(', '))}</div><div class="fact"><b>Настроение</b>${esc(cont.mood)}</div><div class="fact"><b>Темы</b>${esc(cont.themes.join(' · '))}</div></div>
 </div></section>
 <section class="recommend"><div class="eyebrow">Если понравилось</div><h2>Ещё четыре на вечер</h2><div class="mini-grid">${related.map(card).join('')}</div></section>
 </main>`;
}
function score(a,b){return a.details.genres.filter(g=>b.details.genres.includes(g)).length}
function render(){let h=location.hash.slice(1); if(h.startsWith('film/'))film(h.split('/')[1]);else home()}
window.addEventListener('hashchange',render); render();
</script></body></html>
